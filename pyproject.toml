[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-predictor"
version = "0.0.1"
description = "Predicting win rate from champion drafts in League of Legends."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tao1272" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
    "twine>=6",
]

[project.urls]
Repository = "https://github.com/tao1272/draft_predictor"
Issues = "https://github.com/tao1272/draft_predictor/issues"
Changelog = "https://github.com/tao1272/draft_predictor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["draft_predictor*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

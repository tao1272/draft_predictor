[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-predictor"
version = "0.0.1"
description = "Predicting win rate from champion drafts in League of Legends."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tao1272" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.4",
    "lightgbm>=4.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optuna>=4.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "seaborn>=0.13",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "xgboost-cpu>=2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "xgboost>=2.1; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
    "twine>=6",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
explain = [
    "shap>=0.46",
]
deep-learning = [
    "torch>=2.4",
]

[project.urls]
Repository = "https://github.com/tao1272/draft_predictor"
Issues = "https://github.com/tao1272/draft_predictor/issues"
Changelog = "https://github.com/tao1272/draft_predictor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["draft_predictor*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

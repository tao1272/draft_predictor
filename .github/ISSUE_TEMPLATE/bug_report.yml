name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. For security concerns, follow
        SECURITY.md rather than sharing vulnerability details here.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and any relevant error messages.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps or a small example. Remove credentials and private data.
      placeholder: |
        1. Install the project with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: Commit SHA or package version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python version, and installation command.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: For data or prediction issues, include the game patch and data source when relevant.
